<!-- Dark Wizard: original full-body illustration (800x1200, transparent). Hooded arcane wizard in flowing indigo robes with gold trim, a staff topped by a glowing cyan orb, a floating rune sigil in the free hand and a rune circle underfoot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-label="Dark Wizard">
<defs>
<linearGradient id="sm-robe" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#0d1030"/><stop offset=".22" stop-color="#4350a8"/><stop offset=".45" stop-color="#232968"/><stop offset=".62" stop-color="#1a1f55"/><stop offset=".85" stop-color="#383a80"/><stop offset="1" stop-color="#6a5a6a"/></linearGradient>
<linearGradient id="sm-robe2" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#090b22"/><stop offset=".3" stop-color="#1c2058"/><stop offset=".55" stop-color="#0e1032"/><stop offset=".9" stop-color="#201f4c"/><stop offset="1" stop-color="#4a3f52"/></linearGradient>
<linearGradient id="sm-edge" gradientUnits="userSpaceOnUse" x1="170" y1="0" x2="640" y2="0"><stop offset="0" stop-color="#5fd4ff" stop-opacity=".95"/><stop offset=".4" stop-color="#5fd4ff" stop-opacity=".1"/><stop offset=".62" stop-color="#f5d48a" stop-opacity=".15"/><stop offset="1" stop-color="#f5d48a"/></linearGradient>
<linearGradient id="sm-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></linearGradient>
<linearGradient id="sm-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c8"/><stop offset=".45" stop-color="#e8b75a"/><stop offset="1" stop-color="#8a5a1e"/></linearGradient>
<linearGradient id="sm-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#171009"/><stop offset=".5" stop-color="#4a3420"/><stop offset="1" stop-color="#1a110a"/></linearGradient>
<radialGradient id="sm-orb" cx=".38" cy=".34" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#bfeeff"/><stop offset=".6" stop-color="#3fb4ee"/><stop offset="1" stop-color="#0d4a8a"/></radialGradient>
<radialGradient id="sm-halo"><stop offset="0" stop-color="#5fd4ff" stop-opacity=".55"/><stop offset=".5" stop-color="#5fd4ff" stop-opacity=".16"/><stop offset="1" stop-color="#5fd4ff" stop-opacity="0"/></radialGradient>
<radialGradient id="sm-aura" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#5a5cff" stop-opacity=".3"/><stop offset=".6" stop-color="#2c3aa0" stop-opacity=".1"/><stop offset="1" stop-color="#2c3aa0" stop-opacity="0"/></radialGradient>
<radialGradient id="sm-eye"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#7fe0ff"/><stop offset="1" stop-color="#5fd4ff" stop-opacity="0"/></radialGradient>
<filter id="sm-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sm-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>

